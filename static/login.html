<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("sev.theme");if(t==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 — Severus的神秘聚落</title>
<link rel="stylesheet" href="/static/css/app.css?v=3">
</head>
<body>

<nav class="gnav">
  <div class="mark"><a href="/" style="color:#fff;display:flex;align-items:center;gap:7px"><span>☾</span><b>Severus</b></a></div>
  <div class="links"></div>
  <div class="right"><a href="/">返回聚落</a></div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h1 id="title">登录</h1>
    <p class="lead" id="lead">登录后可以发言，也会被记进访客簿。</p>

    <div class="tabs">
      <button type="button" id="tab-login" class="on">登录</button>
      <button type="button" id="tab-register">注册</button>
    </div>

    <form id="form">
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" name="username" autocomplete="username" required
               placeholder="3–20 位，字母、数字、下划线或中文">
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" required
               autocomplete="current-password" placeholder="至少 6 位">
      </div>
      <div class="msg" id="msg"></div>
      <button class="btn solid btn-block" type="submit" id="submit">登录</button>
      <p class="auth-foot" style="margin-top:14px">忘记密码？请联系管理员重置</p>
      <p class="auth-foot" style="margin-top:6px">
        <a href="#" id="to-apply">想加入？先提交申请</a>
      </p>
    </form>

    <form id="apply-form" hidden>
      <p class="lead" style="margin:0 0 14px">提交后等管理员审批，通过就能用这个账号登录。</p>
      <div class="field">
        <label for="ap-user">用户名</label>
        <input id="ap-user" autocomplete="username" placeholder="3–20 位">
      </div>
      <div class="field">
        <label for="ap-pass">密码</label>
        <input id="ap-pass" type="password" autocomplete="new-password" placeholder="至少 6 位">
      </div>
      <div class="field">
        <label for="ap-note">想说的话</label>
        <input id="ap-note" placeholder="你怎么找到这里的（选填）">
      </div>
      <div class="msg" id="ap-msg"></div>
      <button class="btn solid btn-block" type="submit">提交申请</button>
      <p class="auth-foot" style="margin-top:14px">
        <a href="#" id="to-login">‹ 返回登录</a>
      </p>
    </form>

    <p class="auth-foot">注册后即可发帖；只有登录用户会被记录到访客簿。</p>
  </div>
</div>

<div id="toast"></div>
<script src="/static/js/login.js?v=3"></script>
</body>
</html>
