<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("sev.theme");if(t==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Severus的神秘聚落</title>
<meta name="description" content="一座收藏光影的聚落。夜里有照片，也有故事。">
<link rel="stylesheet" href="/static/css/app.css?v=3">
</head>
<body>

<nav class="gnav" id="nav">
  <div class="mark"><span style="visibility:hidden">☾</span><b style="visibility:hidden">Severus</b></div>
  <div class="links">
    <a href="/section?kind=photo">相册</a>
    <a href="/section?kind=video">视频</a>
    <a href="/section?kind=track">音乐</a>
    <a href="/section?kind=forum">论坛</a>
  </div>
  <div class="right" id="nav-right"></div>
  <button class="burger" id="burger" aria-label="展开菜单">☰</button>
</nav>

<header class="hero">
  <h1><span class="wordmark">Severus</span>的神秘聚落</h1>
  <p class="lead">夜里有照片，也有故事。</p>
  <div class="cta">
    <a class="btn solid" href="/section?kind=photo">进入相册</a>
    <a class="btn ghost" href="/section?kind=forum">来聊聊</a>
  </div>
  <p class="stats" id="stats">正在清点这个聚落…</p>
</header>

<main class="hall">

  <!-- 左栏：相册在上，视频在下 -->
  <div class="col-left">
    <section class="card" id="photos">
      <h2 class="mod-head">
        <svg class="mod-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2.5"/>
          <circle cx="8.6" cy="10" r="1.4"/>
          <path d="M3.8 17.4l4.6-4.6a2 2 0 0 1 2.8 0l4.4 4.4"/>
          <path d="M15.4 14.6l1.4-1.4a2 2 0 0 1 2.8 0l1.6 1.6"/>
        </svg>
        <span class="sr-only">相册</span>
        <button class="mod-pin" id="photo-pin" type="button" hidden
                aria-label="置顶文件夹" title="置顶文件夹">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3h6l-1 6 4 3H6l4-3z"/><path d="M12 12v9"/>
          </svg>
        </button>
        <a class="mod-way" href="/section?kind=photo" aria-label="查看全部相册" title="查看全部">›</a>
      </h2>
      <div class="mod-rule" aria-hidden="true"></div>
      <div class="folders" id="photo-folders"></div>
      <div class="folder-panel" id="photo-panel" hidden></div>
      <p class="empty" id="photo-empty" hidden>还没有照片。管理员可以在后台添加。</p>
    </section>

    <section class="card" id="videos">
      <h2 class="mod-head">
        <svg class="mod-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2.5"/>
          <path d="M10.4 9.4l4.6 2.6-4.6 2.6z"/>
        </svg>
        <span class="sr-only">视频</span>
        <button class="mod-pin" id="video-pin" type="button" hidden
                aria-label="置顶文件夹" title="置顶文件夹">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3h6l-1 6 4 3H6l4-3z"/><path d="M12 12v9"/>
          </svg>
        </button>
        <a class="mod-way" href="/section?kind=video" aria-label="查看全部视频" title="查看全部">›</a>
      </h2>
      <div class="mod-rule" aria-hidden="true"></div>
      <div class="folders" id="video-folders"></div>
      <div class="folder-panel" id="video-panel" hidden></div>
      <p class="empty" id="video-empty" hidden>还没有视频。</p>
    </section>

    <section class="card" id="music">
      <h2 class="mod-head">
        <svg class="mod-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9.2 17.2V6.4l8-1.7v10.6"/>
          <circle cx="6.7" cy="17.8" r="2.5"/>
          <circle cx="14.7" cy="16" r="2.5"/>
        </svg>
        <span class="sr-only">音乐</span>
        <button class="mod-pin" id="track-pin" type="button" hidden
                aria-label="置顶歌单" title="置顶歌单">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3h6l-1 6 4 3H6l4-3z"/><path d="M12 12v9"/>
          </svg>
        </button>
        <a class="mod-way" href="/section?kind=track" aria-label="查看全部音乐" title="查看全部">›</a>
      </h2>
      <div class="mod-rule" aria-hidden="true"></div>
      <div class="folders" id="track-folders"></div>
      <div class="folder-panel" id="track-panel" hidden></div>
      <p class="empty" id="track-empty" hidden>还没有音乐。</p>
    </section>
  </div>

  <!-- 中栏：论坛 -->
  <section class="card" id="forum">
    <h2 class="mod-head">
      <span>论坛</span>
      <span class="count" id="post-count"></span>
      <a class="mod-way" href="/section?kind=forum" aria-label="查看全部帖子" title="查看全部">›</a>
    </h2>
    <div class="mod-rule" aria-hidden="true"></div>

    <div class="sortbar" id="sortbar">
      <button type="button" data-sort="recent" class="on">最新</button>
      <button type="button" data-sort="likes">最多赞</button>
      <button type="button" data-sort="comments">最多评论</button>
    </div>

    <div id="composer-area">
      <div class="locked" id="composer-locked" hidden>
        登录后才能发言 · <a href="/login?next=/">去登录</a>
      </div>

      <form class="composer" id="composer" hidden>
        <textarea id="post-body" maxlength="500" placeholder="说点什么…"></textarea>
        <div class="row">
          <span class="hint" id="post-hint">内容 500 字以内</span>
          <button class="btn solid sm" type="submit" id="post-send">发布</button>
        </div>
      </form>
    </div>

    <div class="postscroll" id="post-scroll">
      <ul class="posts" id="post-list"></ul>
      <p class="empty" id="post-empty" hidden>还没有人开口。你可以是第一个。</p>
    </div>

    <div class="pager" id="post-pager" hidden>
      <button type="button" id="post-prev" aria-label="上一页">‹</button>
      <span id="post-page">1 / 1</span>
      <button type="button" id="post-next" aria-label="下一页">›</button>
    </div>
  </section>

  <!-- 右栏：访客记录（登录 + 发帖，十分钟内同一人只记一次） -->
  <aside class="card" id="visitors">
    <h2 class="mod-head">
      <span>访客记录</span>
      <a class="mod-way" href="/section?kind=visitors" aria-label="查看全部访客" title="查看全部">›</a>
    </h2>
    <div class="mod-rule" aria-hidden="true"></div>
    <p class="sub">仅登录用户 · 十分钟内只记一次</p>
    <ul class="vlist2" id="activity-list"></ul>
    <p class="empty" id="activity-empty" hidden>还没有登记在册的访客。</p>
    <p style="margin-top:16px">
      <span class="online"><i></i><span id="user-count">0</span> 位在册用户</span>
    </p>
  </aside>

</main>

<footer>
  <div class="fcols" id="fcols"></div>

  <div class="legal" id="legal"></div>
</footer>

<!-- 灯箱（深色沉浸层） -->
<div class="overlay" id="lightbox" hidden>
  <div class="bar">
    <span class="title" id="lb-title"></span>
    <button class="chip" id="lb-close" aria-label="关闭">✕</button>
  </div>
  <div class="stage">
    <button class="chip nav-arrow prev" id="lb-prev" aria-label="上一张">‹</button>
    <img id="lb-img" alt="">
    <button class="chip nav-arrow next" id="lb-next" aria-label="下一张">›</button>
  </div>
  <div class="caption" id="lb-cap"></div>
</div>

<!-- 播放器（深色沉浸层） -->
<div class="overlay" id="player" hidden>
  <div class="bar">
    <span class="title" id="pl-title"></span>
    <button class="chip" id="pl-close" aria-label="关闭">✕</button>
  </div>
  <div class="stage">
    <video id="pl-video" controls playsinline></video>
  </div>
  <div class="caption" id="pl-cap"></div>
</div>

<div id="toast"></div>

<nav class="mobnav">
  <a href="/section?kind=photo">相册</a>
  <a href="/section?kind=video">视频</a>
  <a href="/section?kind=track">音乐</a>
  <a href="/section?kind=forum">论坛</a>
</nav>
<script src="/static/js/player.js?v=3"></script>
<script src="/static/js/app.js?v=3"></script>
</body>
</html>
